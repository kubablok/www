<!doctype html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Prohlédni si přehled odpoledních aktivit během týdne včetně dne a času.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Týdenní plán | Můj osobní web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Můj osobní web</h1>

        <nav aria-label="Hlavní navigace">

            <a href="galerie.html">Galerie</a>

        </nav>

    <main>
        <section>
            <h2>Můj týdenní plán</h2>

            <p>
                Přehled odpoledních aktivit během týdne včetně času, kdy se jim věnuji.
            </p>

            <div class="table-scroll">
                <table>
                    <caption>Odpolední aktivity</caption>
                    <thead>
                        <tr>

                    </thead>
                    <tbody>
                        <tr>
                            <td>Pondělí</td>
                            <td>Programování</td>
                            <td>15:00</td>
                        </tr>
                        <tr>
                            <td>Středa</td>
                            <td>Sport</td>
                            <td>16:30</td>
                        </tr>
                        <tr>
                            <td>Pátek</td>
                            <td>Hudba</td>
                            <td>17:00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Vytvořeno v hodinách Úvodu do WWW</p>
